name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-26 是 GitHub 当前 macos-latest 指向的镜像；写死版本号，避免以后 latest 漂移时突然换 Xcode。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show environment
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Board2Shell.xcodeproj \
            -scheme Board2Shell \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            B2_COMMIT="${GITHUB_SHA}" \
            build 2>&1 | tee xcodebuild.log

      - name: Show build log tail on failure
        if: failure()
        run: |
          if [ -f xcodebuild.log ]; then
            echo "===== error lines ====="
            grep -nE "error:|fatal error|\*\* BUILD FAILED" xcodebuild.log || true
            echo "===== last 300 lines ====="
            tail -n 300 xcodebuild.log
          else
            echo "xcodebuild.log not found"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Board2Shell.app"
          if [ ! -d "$APP" ]; then
            echo "App not found at $APP"
            find build/Build/Products -maxdepth 2 -name "*.app" -print || true
            exit 1
          fi
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Board2-untested.ipa Payload)
          ls -la Board2-untested.ipa
          unzip -l Board2-untested.ipa | head -n 20
          echo "sha256 (build): $(shasum -a 256 Board2-untested.ipa | cut -d' ' -f1)"

      # 名字带 untested：模拟器测试没过之前不算可交付；下面的 release 任务在模拟器测试通过后才发出 Board2.ipa
      - name: Upload IPA (untested)
        uses: actions/upload-artifact@v7
        with:
          path: Board2-untested.ipa
          # 不再套一层 zip，下载下来直接就是 Board2.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  simulator:
    # 在 iPad 模拟器里跑起 App：截主要画面（深浅两套 × 横竖），连得上 / 连不上各自检一次。不影响上面出安装包。
    runs-on: macos-26
    timeout-minutes: 100

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Run UI-test screenshots on iPad simulator
        run: |
          chmod +x ci/sim_shots.sh
          ci/sim_shots.sh shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots
          if-no-files-found: warn
          retention-days: 30

  stress:
    # 边缘压力测试：工具条每个按钮、左边缘抽屉题格各连点 300 下（ci/sim_stress.sh、UITests/StressUITests.swift），全屏 / 窗口 × 竖 / 横 四个并排跑
    # 等 build 先跑完再开始（macOS 机器同时只给几台：r29 里 build 排队 74 分钟后被取消了）
    needs: [build]
    if: ${{ !startsWith(github.event.head_commit.message, '诊断') }}
    runs-on: macos-26
    # 窗口模式下 XCUITest 每点一下要等 SpringBoard 空闲 1.5–1.8 秒（r31 窗口竖屏：2642 下用了 8382 秒），3000 下要将近 3 小时
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        cfg: [full-portrait, full-landscape, windowed-portrait, windowed-landscape]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Stress taps on iPad simulator
        run: |
          chmod +x ci/sim_stress.sh
          ci/sim_stress.sh stress ${{ matrix.cfg }}

      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.cfg }}
          path: stress
          if-no-files-found: warn
          retention-days: 30

  release:
    # 编译、模拟器测试、压力测试都过了才发可交付的安装包 Board2.ipa：把 build 任务那个文件原样取下来（不解压、不重新打包），改个名再发
    needs: [build, simulator, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch untested IPA as-is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          q='.artifacts[] | select(.name=="Board2-untested.ipa")'
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq "${q} | .id")
          digest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq "${q} | .digest")
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > Board2.ipa
          ls -la Board2.ipa
          got="sha256:$(sha256sum Board2.ipa | cut -d' ' -f1)"
          echo "artifact digest: ${digest}"
          echo "downloaded:      ${got}"
          [ "${got}" = "${digest}" ] || { echo "downloaded file differs from the build artifact"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: Board2.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30
